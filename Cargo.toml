[package]
name = "ramwhere"
version = "0.1.1"
edition = "2021"
description = "Shows where every byte of RAM on a Windows PC is going"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wgpu", "x11", "wayland"] }
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aho-corasick = "1.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
